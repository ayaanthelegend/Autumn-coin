# Base configuration for Autumn Coin 2D Quasi-Steady Simulation

fluid:
  rho_f: 998.0         # Fluid density (water at 20 C) [kg/m^3]
  mu: 0.001            # Dynamic viscosity [Pa*s]
  g: 9.81              # Gravitational acceleration [m/s^2]

numerics:
  integrator: "DOP853" # SciPy solve_ivp integrator
  rtol: 1.0e-9         # Relative tolerance
  atol: 1.0e-11        # Absolute tolerance
  dt_out: 0.001        # Output sampling interval [s]
  H_fall_factor: 40.0  # Fall depth in units of chord L (H_fall = H_fall_factor * L)
  t_max_factor: 3.0    # Adaptive t_max factor: t_max = max(t_max_min, t_max_factor * H_fall / U_t)
  t_max_min: 30.0      # Minimum t_max [s]
  seed: 42             # Global default random seed

coefficients:
  C_T: 1.2             # Translational circulation coefficient (VERIFY)
  C_R: 3.141592653589793 # Rotational circulation coefficient pi (VERIFY)
  C_D0: 1.4            # Viscous drag constant term (VERIFY)
  C_D1: 1.0            # Viscous drag angle dependence term (VERIFY)
  C_tau: 0.2           # Rotational damping torque coefficient (VERIFY)
  c_lin: 0.0           # Optional linear rotational damping [N*m*s/rad]
  eps_V: 1.0e-7        # Velocity regularization threshold [m/s]

regime_classifier:
  transient_fraction: 0.1 # Discard initial 10% of fall depth
  theta_range_steady: 0.2 # Maximum theta range for steady descent [rad]
  var_theta_steady: 0.005 # Maximum theta variance for steady descent [rad^2]
  min_flips_tumble: 2    # Minimum full 2*pi rotations for tumbling regime
